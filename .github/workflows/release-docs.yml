name: Release Documentation Version

# Triggered by wso2/agent-manager when a GA release is published. That workflow
# first pushes the regenerated Helm chart reference pages and the installer into
# this repository, then dispatches this event to cut a versioned snapshot and
# publish it.

on:
  repository_dispatch:
    types: [agent-manager-release]
  workflow_dispatch:
    inputs:
      version:
        description: "Docs version to cut (e.g. v1.1.0)"
        required: true
        type: string
      docker_tag:
        description: "Release tag for image references (e.g. v1.1.0)"
        required: true
        type: string

run-name: Release docs ${{ github.event.client_payload.version || inputs.version }}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  cut-and-deploy:
    name: Cut version, build and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      VERSION: ${{ github.event.client_payload.version || inputs.version }}
      DOCKER_TAG: ${{ github.event.client_payload.docker_tag || inputs.docker_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate inputs
        run: |
          set -euo pipefail
          if [ -z "$VERSION" ] || [ -z "$DOCKER_TAG" ]; then
            echo "::error::VERSION and DOCKER_TAG are both required"
            exit 1
          fi
          if ! printf '%s' "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::VERSION '$VERSION' is not of the form vMAJOR.MINOR.PATCH"
            exit 1
          fi
          if grep -q "\"$VERSION\"" versions.json; then
            echo "::error::Version $VERSION already exists in versions.json"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Create documentation version
        run: make version VERSION="$VERSION" DOCKER_TAG="$DOCKER_TAG"

      - name: Verify version replacement
        run: |
          set -o pipefail

          PLACEHOLDER_COUNT=$(grep -r -E "v?0\.0\.0-dev" "versioned_docs/version-$VERSION/" 2>/dev/null | wc -l | tr -d ' ') || true
          PLACEHOLDER_COUNT="${PLACEHOLDER_COUNT:-0}"

          if [ "$PLACEHOLDER_COUNT" -gt 0 ]; then
            echo "❌ Found $PLACEHOLDER_COUNT remaining placeholder references:"
            grep -r -n -E "v?0\.0\.0-dev" "versioned_docs/version-$VERSION/" || true
            exit 1
          fi
          echo "✅ No placeholders found in versioned docs"

          if ! grep -q "latestVersion:.*'$VERSION'" docs/_constants.md; then
            echo "❌ docs/_constants.md does not contain latestVersion: '$VERSION'"
            cat docs/_constants.md
            exit 1
          fi
          if ! grep -q "quickStartDockerTag:.*'$DOCKER_TAG'" docs/_constants.md; then
            echo "❌ docs/_constants.md does not contain quickStartDockerTag: '$DOCKER_TAG'"
            cat docs/_constants.md
            exit 1
          fi
          echo "✅ _constants.md verified"

      # Build before committing, so a snapshot that cannot build never reaches main.
      - name: Build documentation
        run: npm run build

      - name: Commit the snapshot
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versioned_docs/ versioned_sidebars/ versions.json docs/_constants.md
          if git diff --staged --quiet; then
            echo "No snapshot changes to commit"
          else
            # [skip ci] keeps this push from retriggering deploy.yml. This job
            # already deploys; without the marker every release deploys twice and
            # the two runs race.
            git commit -m "docs: release documentation version $VERSION [skip ci]"
            git push origin HEAD:main
          fi

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
